<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bar Down Jones - Bolsa de Bebidas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- Temporizador de Crash -->
    <div id="crash-timer" class="crash-timer">Próximo Crash en: <span id="countdown">15:00</span></div>

    <!-- Cuadro de Bebidas -->
    <div class="drinks-grid">
      <div class="column">
        <h2>Cócteles</h2>
        <ul id="cocktails"></ul>
      </div>
      <div class="column">
        <h2>Cervezas</h2>
        <ul id="beers"></ul>
      </div>
      <div class="column">
        <h2>Sin Alcohol</h2>
        <ul id="non-alcoholic"></ul>
      </div>
    </div>

    <!-- Ticker Inferior -->
    <div class="ticker-container">
      <div class="ticker" id="ticker"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
